<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat With Your Documents</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar for document upload -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fa-solid fa-layer-group"></i> RAG Chat</h2>
            </div>
            
            <div class="upload-section" id="drop-zone">
                <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                <p>Drag & Drop documents here</p>
                <span>or</span>
                <button class="btn-primary" onclick="document.getElementById('file-input').click()">Browse Files</button>
                <input type="file" id="file-input" hidden accept=".pdf,.txt,.md">
            </div>
            
            <div id="upload-status" class="status-msg hidden"></div>
            
            <div class="documents-list">
                <h3>Uploaded Documents</h3>
                <ul id="doc-list">
                    <!-- dynamically populated -->
                </ul>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <div class="chat-header">
                <h1>Chat with your Documents</h1>
                <p>Ask questions grounded in the files you uploaded.</p>
            </div>
            
            <div class="messages-container" id="messages-container">
                <div class="message ai-message welcome-msg">
                    <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="bubble">
                        Hello! Upload some documents on the left, then ask me anything about them.
                    </div>
                </div>
            </div>
            
            <div class="input-container">
                <form id="chat-form">
                    <input type="text" id="chat-input" placeholder="Ask a question about your documents..." autocomplete="off" required>
                    <button type="button" class="stop-btn hidden" id="stop-btn" title="Stop generation"><i class="fa-solid fa-stop"></i></button>
                    <button type="submit" class="send-btn" id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
                </form>
            </div>
        </main>
    </div>

    <!-- Include marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.css"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js?v=2"></script>
</body>
</html>
